name: sre-env
version: 1.0.0
description: >
  SRE Incident Response Commander trains agents to diagnose and fix
  multi-service production incidents with dependency traps and dense rewards.
author: Madhav
license: MIT

environment:
  action_type: SREAction
  observation_type: SREObservation
  state_type: SREState
  max_steps: 20
  difficulties: [easy, medium, hard]
  reward_type: dense

huggingface:
  space_id: your-username/sre-env
  sdk: docker
  hardware: cpu-basic
