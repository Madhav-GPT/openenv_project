name: sre-env
version: 2.0.0
description: >
  Unified three-phase incident response environment combining infrastructure
  triage, security remediation, and post-mortem reasoning.
author: Madhav
license: MIT

environment:
  action_type: SREAction
  observation_type: SREObservation
  state_type: SREState
  max_steps: 25
  difficulties: [easy, medium, hard]
  reward_type: dense

huggingface:
  space_id: madhav/sre-env
  sdk: docker
  hardware: cpu-basic
